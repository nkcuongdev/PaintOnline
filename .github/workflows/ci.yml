# CI (mục 9 GĐ0, 11.1, 13.3): typecheck, lint, unit test, build, Playwright smoke;
# tự deploy bản preview lên Cloudflare Pages khi đã cấu hình secrets.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: 24

jobs:
  quality:
    name: Typecheck · Lint · Unit test · Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Kiểm tra lỗ hổng phụ thuộc (mục 10.2)
        run: npm audit --audit-level=high --omit=dev
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7

  browser:
    name: Browser test · E2E smoke (Chromium, Firefox, WebKit)
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Cài trình duyệt Playwright
        run: npx playwright install --with-deps chromium firefox webkit
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Vitest browser mode (canvas thật)
        run: npm run test:browser
      - name: Playwright E2E smoke
        run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  bench:
    name: Benchmark S/M (thông tin, không chặn)
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 20
    # Máy CI dùng chung, số đo nhiễu (mục 11.2): chỉ để phát hiện hồi quy lớn, không chặn merge.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox
      - run: npm run bench
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench-results
          path: tests/bench/results
          retention-days: 30

  deploy-preview:
    name: Deploy preview (Cloudflare Pages)
    runs-on: ubuntu-latest
    needs: [quality, browser]
    # Bỏ qua khi chưa cấu hình secrets (fork, repo mới) thay vì làm đỏ CI.
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    permissions:
      contents: read
      deployments: write
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT || 'paint-online' }}
    steps:
      - uses: actions/download-artifact@v4
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
        with:
          name: dist
          path: dist
      - name: Deploy lên Cloudflare Pages
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ env.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=${{ env.CLOUDFLARE_PROJECT }} --branch=${{ github.head_ref || github.ref_name }}
      - name: Chưa cấu hình Cloudflare
        if: ${{ env.CLOUDFLARE_API_TOKEN == '' }}
        run: echo "::notice::Bỏ qua deploy preview — thêm secrets CLOUDFLARE_API_TOKEN và CLOUDFLARE_ACCOUNT_ID để bật."
